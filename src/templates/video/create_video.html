<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <!-- Google Fonts - Inter for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
        }
        .card {
            border-radius: 1rem; /* Rounded corners for the card */
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1); /* Soft shadow */
            padding: 2rem; /* Inner padding */
        }
        .form-label {
            font-weight: 500; /* Medium weight for labels */
            color: #495057; /* Darker gray for labels */
            margin-bottom: 0.5rem; /* Space below labels */
        }
        .form-control {
            border-radius: 0.5rem; /* Rounded corners for inputs */
            padding: 0.75rem 1rem; /* Larger padding for inputs */
            border: 1px solid #ced4da; /* Default border color */
        }
        .form-control:focus {
            border-color: #80bdff; /* Bootstrap primary focus color */
            box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25); /* Bootstrap primary focus shadow */
        }
        .btn-primary {
            border-radius: 0.5rem; /* Rounded corners for button */
            padding: 0.75rem 1.5rem; /* Larger padding for button */
            font-weight: 600; /* Semi-bold font for button */
            background-color: #007bff; /* Bootstrap primary color */
            border-color: #007bff;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #0056b3; /* Darker primary on hover */
            border-color: #004085;
        }
        h3 {
            font-weight: 700; /* Bold title */
            color: #343a40; /* Dark text for title */
            margin-bottom: 1.5rem; /* Space below title */
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card w-100" style="max-width: 500px;">
            <h3 class="card-title">Add New Video</h3>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.help_text %}
                            <small class="form-text text-muted">{{ field.help_text }}</small>
                        {% endif %}
                        {% for error in field.errors %}
                            <div class="text-danger">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary w-100">Add</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS (optional, for components that need it) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</body>
</html>
