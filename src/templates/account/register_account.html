<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <!-- Load Tailwind CSS CDN for quick and modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Define Inter font for the entire body */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h3 class="text-3xl font-bold text-gray-800 mb-6 text-center">Create Account</h3>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <h5 class="block text-sm font-medium text-gray-700 mb-1">Username</h5>
                <input
                    type="text"
                    name="username"
                    id="username"
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="Your username"
                    required
                >
            </div>

            <div>
                <h5 class="block text-sm font-medium text-gray-700 mb-1">User email</h5>
                <input
                    type="email"
                    name="email"
                    id="email"
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="your.email@example.com"
                    required
                >
            </div>

            <div>
                <h5 class="block text-sm font-medium text-gray-700 mb-1">User password</h5>
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button
                type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200"
            >
                Create Account
            </button>
        </form>
    </div>
</body>
</html>
