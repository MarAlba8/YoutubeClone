<!DOCTYPE html>
<html>
     <div class="video-wrapper"> {# Un contenedor para aplicar estilos si es necesario #}
          {{ video.embed_url|safe }}
     </div>
     <h1>{{ video.title }}</h1>

     <div>
         <div class="reaction-buttons">
          {# Botón de Like #}
          <form action="{% url 'video_reaction' video.pk %}" method="post" style="display: inline-block;">
               {% csrf_token %}
               <input type="hidden" name="reaction_type" value="like">
               <button type="submit">
                    👍 Me gusta ({{ video.get_likes_count }})
               </button>
          </form>

          {# Botón de Dislike #}
          <form action="{% url 'video_reaction' video.pk %}" method="post" style="display: inline-block; margin-left: 10px;">
               {% csrf_token %}
               <input type="hidden" name="reaction_type" value="dislike">
               <button type="submit">
                    👎 No me gusta ({{ video.get_dislikes_count }})
               </button>
          </form>
          </div>
     </div>
     <h3>Comments</h3>
     <form action="{% url 'comment_create' video.pk %}" method="post">
          {% csrf_token %}
          <textarea name="text">Write comment</textarea>
          <button type="submit">Submit</button>
     </form>
     {% for comment in video.comments.all %}
          <label>{{ comment.user.username}}</label>
          <p>{{ comment.text}}</p>
     {% endfor %}

     <a href="{% url 'video_home_list' %}">Home</a>
</html>
