<!DOCTYPE html>

<html>
     <h3>Hola</h3>
     <form action="{% url 'logout' %}" method="post" style="display: inline;"> {# display: inline; para que no rompa el layout si va en una barra #}
          {% csrf_token %} {# ¡CRUCIAL! Asegura que la solicitud POST sea segura #}
          <button type="submit" style="background: none; border: none; color: inherit; cursor: pointer; padding: 0; font: inherit;">
               Log out
          </button>
     </form>
</html>
